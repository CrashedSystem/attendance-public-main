  .teamhead { text-align:center; font-size:11px; margin:8px 0 4px; color:#3b5bdb; font-weight:bold; }
  table.abs { width:100%; border-collapse:collapse; font-size:10px; }
  table.abs th, table.abs td { border:1px solid #dee2e6; padding:2px 6px; text-align:center; }
  table.abs th { background:#f1f3f5; }
  .w1 { background:#fff4e6; } .w2 { background:#ffe3e3; }
  .w3 { background:#ffd8a8; } .w4 { background:#ffa8a8; }
  .badge { display:inline-block; min-width:16px; padding:1px 6px; border-radius:9px; font-size:10px; font-weight:bold; color:#fff; }
  .badge.b1 { background:#e8590c; } .badge.b2 { background:#e03131; } .badge.b3 { background:#c2255c; } .badge.b4 { background:#9c36b5; }
  .nophone { color:#adb5bd; }
  .nb { display:inline-block; padding:0 6px; margin-left:4px; border-radius:8px; background:#d3f9d8; color:#2b8a3e; font-weight:bold; font-size:9px; vertical-align:1px; }
  @page { size: A4; margin: 8mm; }
  @media print {
    body { background:#fff; padding:0; }
    .sheet { box-shadow:none; border-radius:0; padding:0; max-width:100%; }
    table.abs { font-size:9px; }
    table.abs th, table.abs td { padding:1px 4px; }

  const list = C.newbies || [];
  if (!list.length) {
    document.getElementById('newbie-wrap').innerHTML = '<p style="text-align:center;color:#888;margin:4px 0">새신우가 없습니다.</p>';
    return;
  }
  const badges = { 1: 'b1', 2: 'b2', 3: 'b3', 4: 'b4' };
  const rows = list.map(function (n, idx) {
    let att;
    if (n.att) {
      att = '출석 ' + n.att;
    } else {
      const wk = n.w || 0;
      att = wk >= 1
        ? '<span class="badge ' + badges[Math.min(wk, 4)] + '">' + Math.min(wk, 99) + '주 연속 미출석</span>'

    }
    const cls = (!n.att && n.w >= 1) ? ' class="w' + Math.min(n.w, 4) + '"' : '';
