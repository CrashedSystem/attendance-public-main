<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>출석 현황 그래프</title>
<style>
  * { box-sizing: border-box; }
  body { font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif; background:#f3f4f6; margin:0; padding:10px 10px; color:#1f2937; -webkit-font-smoothing:antialiased; }
  .sheet { background:#fff; max-width:1100px; margin:0 auto; padding:12px 16px 14px; border-radius:12px; box-shadow:0 1px 12px rgba(17,24,39,.06); }
  h1 { text-align:center; margin:0 0 3px; font-size:19px; font-weight:800; letter-spacing:-.01em; color:#111827; }
  .sub { text-align:center; color:#9ca3af; margin:0; font-size:11px; letter-spacing:.02em; }
  hr.topline { border:0; border-top:1px solid #eef0f3; margin:7px 0 9px; }

  /* 통계 요약 박스 (한 줄) */
  .stat { display:flex; gap:8px; justify-content:center; }
  .stat .box { flex:1; min-width:0; background:#f6f7f9; border:1px solid #edf0f2; border-radius:9px; padding:8px 10px; text-align:center; }
  .stat .box b { display:block; font-size:13px; font-weight:700; color:#1f2937; word-break:keep-all; }
  .stat .box span { font-size:10px; color:#6b7280; }
  .stat .box.up { border-color:#bfe6cd; background:#f2fbf5; } .stat .box.up b { color:#15803d; }
  .stat .box.down { border-color:#f3c3c3; background:#fef6f6; } .stat .box.down b { color:#b91c1c; }
  .stat .box.fade { background:#fafafa; border-color:#eef0f2; } .stat .box.fade b { color:#c3c8cf; } .stat .box.fade span { color:#c3c8cf; }

  /* 섹션 카드 */
  .card { margin-bottom:8px; background:#fff; border:1px solid #eef0f3; border-radius:9px; padding:10px 12px; }
  .card h2 { font-size:12px; font-weight:700; margin:0 0 7px; color:#111827; display:flex; align-items:center; gap:8px; letter-spacing:.01em; }
  .card h2::before { content:''; width:4px; height:12px; border-radius:2px; background:#465aa9; flex:none; }

  /* 테이블 */
  table.abs { width:100%; border-collapse:collapse; font-size:11px; }
  table.abs th { background:#f8f9fa; border-bottom:1px solid #e5e7eb; padding:4px 8px; text-align:center; font-size:10px; font-weight:600; color:#6b7280; letter-spacing:.02em; }
  table.abs td { border-bottom:1px solid #f0f1f3; padding:4px 8px; text-align:center; color:#374151; }
  table.abs tr:last-child td { border-bottom:0; }
  table.abs tr:hover td { background:#fafbfc; }
  .w1 td { } .w2 td { } .w3 td { } .w4 td { }
  tr.w1 td { background:#fffaf5; } tr.w2 td { background:#fef4f4; } tr.w3 td { background:#fdf5ff; } tr.w4 td { background:#f6f4fe; }
  table.abs tr.unauth td { background:#fee2e2 !important; color:#991b1b; font-weight:700; }

  /* 연속 미출석 배지 */
  .badge { display:inline-block; min-width:34px; padding:2px 8px; border-radius:999px; font-size:10px; font-weight:700; text-align:center; }
  .badge.b1 { background:#fdeedb; color:#c2571b; } .badge.b2 { background:#fce4e4; color:#b91c1c; }
  .badge.b3 { background:#fdebf4; color:#a21caf; } .badge.b4 { background:#ece9fb; color:#6d28d9; }

  /* 결석 사유 흐름 (수요일) */
  .wtag { display:inline-block; padding:2px 8px; margin:1px 2px; border-radius:999px; background:#e9edf9; color:#3f53a6; font-size:9px; font-weight:600; white-space:nowrap; }
  .wflow { margin:0 3px; color:#c3c8cf; font-weight:700; font-size:10px; }

  /* 새신우 태그 */
  .nb { display:inline-block; padding:1px 8px; margin-left:5px; border-radius:999px; background:#e5f6ea; color:#15803d; font-weight:700; font-size:9px; vertical-align:1px; white-space:nowrap; }
  .nophone { color:#c3c8cf; }

  /* 팀 섹션 헤더 (생일자 묶음) */
  .teamhead { text-align:left; font-size:11px; font-weight:700; margin:8px 0 3px; color:#465aa9; padding-top:6px; border-top:1px solid #f0f1f3; }
  .teamhead:first-child { border-top:0; padding-top:0; margin-top:0; }

  .empty { text-align:center; color:#9ca3af; margin:6px 0; font-size:11px; }

  /* 닫기(X) 버튼 — 오른쪽 상단 고정 */
  .close-rpt {
    position: fixed; top: 12px; right: 12px; z-index: 50;
    width: 34px; height: 34px; border: 0; border-radius: 50%;
    background: rgba(17, 24, 39, .32); color: #fff;
    font-size: 20px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s ease, transform .15s ease;
    box-shadow: 0 1px 6px rgba(0, 0, 0, .18);
  }
  .close-rpt:hover { background: rgba(185, 28, 28, .92); transform: scale(1.06); }
  .close-rpt:active { transform: scale(.94); }

  @page { size: A4; margin: 8mm; }
  @media print {
    body { background:#fff; padding:0; }
    .close-rpt { display: none !important; }
    .sheet { box-shadow:none; border-radius:0; padding:0; max-width:100%; }
    table.abs { font-size:10px; }
    table.abs th, table.abs td { padding:5px 8px; }
    .stat { margin-bottom:4px; }
    .card { margin-bottom:8px; padding:12px 14px; }
  }
</style>
</head>
<body>
<div class="sheet">
<h1>출석 현황</h1>
<p class="sub">수요일 예배 · 2026-08-26 ~ 2026-08-26 · 총 9건</p>
<hr class="topline">

<div class="card">
  <h2>출석 통계 요약</h2>
  <div class="stat">
  </div>
</div>

<div class="card">
  <h2>팀별 출석 인원 (이번 주)</h2>
  <div class="table-wrap" id="team-wrap"></div>
</div>

<div class="card">
  <h2>새신우 현황 · 총 0명</h2>
  <div class="table-wrap" id="newbie-wrap"></div>
</div>

<div class="card">
  <h2>이달의 생일자 (8월) · 총 0명</h2>
  <div class="table-wrap" id="bday-wrap"></div>
</div>
</div>

<button class="close-rpt" id="btn-close-rpt" type="button" aria-label="보고서 닫기" title="닫기">×</button>

<script>
const C = {"dates": ["2026-08-26"], "counts": [9], "total": 9, "days": 1, "avg": 9.0, "thiswk": "2026-08-26 9명", "lastwk": "", "maxd": "2026-08-26 9명", "absent": [], "bday": [], "teams": [], "newbies": []};

/* 보고서 닫기 */
document.getElementById('btn-close-rpt').addEventListener('click', function () {
  window.close();
  setTimeout(function () { window.location.href = 'about:blank'; }, 200);
});

/* 팀별 출석 인원 (이번 주) */
(function () {
  const rows = C.teams.map(function (t) {
    return '<tr><td>' + t.team + '</td><td>' + t.count + '명</td></tr>';
  }).join('');
  var html = '<table class="abs"><tr><th>팀</th><th>출석 인원</th></tr>' + rows + '</table>';
  document.getElementById('team-wrap').innerHTML = html;
})();

/* 새신우 현황 */
(function () {
  const list = C.newbies || [];
  if (!list.length) {
    document.getElementById('newbie-wrap').innerHTML = '<p class="empty">새신우가 없습니다.</p>';
    return;
  }
  const badges = { 1: 'b1', 2: 'b2', 3: 'b3', 4: 'b4' };
  const rows = list.map(function (n, idx) {
    let att;
    if (n.att) {
      att = '출석 ' + n.att;
    } else {
      const wk = n.w || 0;
      att = wk >= 1
        ? '<span class="badge ' + badges[Math.min(wk, 4)] + '">' + Math.min(wk, 99) + '주 연속 미출석</span>'
        : '<span style="color:#b91c1c">미출석</span>';
    }
    const cls = (!n.att && n.w >= 1) ? ' class="w' + Math.min(n.w, 4) + '"' : '';
    return '<tr' + cls + '><td>' + (idx + 1) + '</td><td>' + n.name + '</td><td>' + n.aff + '</td><td>' + n.team + '</td>' +
      '<td>' + (n.phone ? n.phone : '<span class="nophone">-</span>') + '</td>' +
      '<td>' + att + '</td></tr>';
  }).join('');
  var html = '<table class="abs"><tr><th>No</th><th>이름</th><th>소속</th><th>팀</th><th>휴대폰</th><th>이번 주 출결</th></tr>' + rows + '</table>';
  document.getElementById('newbie-wrap').innerHTML = html;
})();

/* 이달의 생일자 - 팀별로 묶어 표시 */
(function () {
  const byTeam = {};
  C.bday.forEach(function (b) {
    const k = b.team || '-';
    if (!byTeam[k]) byTeam[k] = [];
    byTeam[k].push(b);
  });
  const teams = Object.keys(byTeam).sort();
  let html = '';
  teams.forEach(function (k) {
    html += '<div class="teamhead">' + k + '</div>';
    const rows = byTeam[k].map(function (b) {
      return '<tr><td>' + b.bday + '</td><td>' + b.name + '</td><td>' + b.aff + '</td>' +
        '<td>' + (b.phone ? b.phone : '<span class="nophone">-</span>') + '</td></tr>';
    }).join('');
    html += '<table class="abs"><tr><th>생일</th><th>이름</th><th>소속</th><th>휴대폰</th></tr>' + rows + '</table>';
  });
  document.getElementById('bday-wrap').innerHTML = html;
})();
</script>
</body>
</html>
